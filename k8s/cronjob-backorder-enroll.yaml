apiVersion: batch/v1
kind: CronJob
metadata:
  name: back-in-stock-backorder-enroll
  labels:
    app.kubernetes.io/name: back-in-stock-backorder-enroll
spec:
  # Backfill periódico: enrola TODO producto backorder (CONTINUE + stock 0) que aún
  # no esté en una campaña factory_order, dándole selling plan + hold. Cierra la
  # fuga "bare CONTINUE" de forma duradera (el apply-tick de catalog-RAG marca
  # nuevos backorder cada hora; este cron los engancha al sistema factory).
  # Llama POST /api/admin/preorders/backorder-import {action:enroll}; idempotente
  # (no-op cuando preview.safeProductCount=0).
  #
  # SUSPENDIDO 2026-07-09 por decisión de producto (Dani): este auto-enroll
  # convertía en preorder CUALQUIER producto CONTINUE+stock0 sin campaña, es
  # decir, decidía solo la "comprabilidad a fábrica" — que debe ser una decisión
  # MANUAL por campaña, no un cron. Las 24 campañas factory_order existentes se
  # CONSERVAN (decisión C); solo se para la creación automática futura.
  # Para reactivar: quitar `suspend: true`.
  suspend: true
  schedule: "15 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # El enroll es un batch de reconciliación sobre 3000+ productos (~4min
      # normal); bajo variance de la Shopify Admin API (rate-limits/carga) puede
      # pasar de 10min. Con 600s el job se moría con DeadlineExceeded de forma
      # intermitente (→ ArgoCD Degraded). 1800s da headroom (7.5x el caso normal);
      # si algún día supera 30min es un hang real que sí conviene fallar.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: back-in-stock-backorder-enroll
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          imagePullSecrets:
            - name: harbor-pull
          nodeSelector:
            role: edge
            kubernetes.io/arch: amd64
          tolerations:
            - key: role
              operator: Equal
              value: edge
              effect: NoSchedule
          containers:
            - name: enroll
              # Reusa la imagen de la app (cacheada en el nodo edge) solo para un
              # node fetch — no depende de docker.io. El digest se mantiene alineado
              # con la app en cada deploy.
              image: harbor.lan.e-dani.com/homelab/shopify-back-in-stock@sha256:66cd235d3b54171536f561ae64b86c28ae028f8d9f13bd6cb033933d50b52506
              imagePullPolicy: IfNotPresent
              command:
                - node
                - -e
                - |
                  const url = 'http://back-in-stock-app/api/admin/preorders/backorder-import';
                  const token = process.env.PREORDERS_API_TOKEN;
                  if (!token) { console.error('PREORDERS_API_TOKEN missing'); process.exit(1); }
                  const ctrl = new AbortController();
                  // 29min: por debajo de activeDeadlineSeconds (1800s) para que el
                  // fetch aborte con un error legible ("...error <aborted>") ANTES
                  // de que el job muera por DeadlineExceeded (que no deja mensaje).
                  const timer = setTimeout(() => ctrl.abort(), 1740000);
                  fetch(url, {
                    method: 'POST',
                    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'enroll' }),
                    signal: ctrl.signal,
                  })
                    .then(async (r) => {
                      clearTimeout(timer);
                      const body = await r.text();
                      console.log('backorder-enroll', r.status, body.slice(0, 1000));
                      process.exit(r.ok ? 0 : 1);
                    })
                    .catch((e) => { clearTimeout(timer); console.error('backorder-enroll error', e && e.message); process.exit(1); });
              env:
                - name: PREORDERS_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: back-in-stock-secrets
                      key: PREORDERS_API_TOKEN
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
