apiVersion: batch/v1
kind: CronJob
metadata:
  name: back-in-stock-preorder-hold-reconcile
  labels:
    app.kubernetes.io/name: back-in-stock-preorder-hold-reconcile
spec:
  # SKIRM-624 (ley SC-5617, todo por eventos): this CronJob is NO LONGER the global
  # 10-min sweep. The reconcilers now react to the webhooks the app already
  # receives (repo shopify-back-in-stock):
  #   - coverage (requiresSellingPlan<->stock): inventory_levels/update, scoped to
  #     the changed variant. A Picqer receipts.completed arrives through the same
  #     webhook: Shopify's `available` is Picqer's free stock, so a completed
  #     receipt updates the Shopify inventory level and fires it.
  #   - holds + stock gate: orders/create (hold inline via processPreorderOrder +
  #     stock gate scoped to the new order's variants) and inventory_levels/update
  #     (stock gate scoped to the restocked variant — releases held orders the
  #     moment stock lands).
  # The coverage CronJob (3-59/10) is deleted here; the */10 global hold sweep is
  # replaced by this DECLARED retry net, kept ONLY for the orders/create<->Picqer
  # -pull race: the warehouse pulling the order is an external event back-in-stock
  # never receives (the fulfillment order becomes "uninterruptible" and only
  # returns to holdable when Picqer releases it, for which no webhook exists), so
  # a failed hold has no event to wait on — a scheduled retry is the only
  # recovery path. Hourly bounds the delay of that rare failure (the race itself
  # resolves in minutes, and the hold's own deadline is the campaign ship date,
  # weeks away). The endpoint also keeps the global stock-gate pass and the
  # once-per-campaign "ships in a week" notice (Telegram ops + info@skirmshop.es)
  # as the safety net for events lost after Shopify's webhook-redelivery window.
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Reconcile de holds: normal ~50s, pero bajo variance de la Shopify Admin
      # API sube de 2min y con 180s el job se moría con DeadlineExceeded (→ ArgoCD
      # Degraded), mismo patrón que el antiguo backorder-enroll. 600s da headroom (>4x el pico
      # observado de ~2m27s); un run >10min sería un hang real que sí fallar.
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: back-in-stock-preorder-hold-reconcile
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          imagePullSecrets:
            - name: harbor-pull
          nodeSelector:
            kubernetes.io/arch: amd64
          tolerations:
            - key: role
              operator: Equal
              value: edge
              effect: NoSchedule
          containers:
            - name: reconcile
              # Reuse the app image (already cached on the edge node, pulled via
              # harbor-pull) only to run a tiny node fetch — no docker.io dependency.
              image: harbor.lan.e-dani.com/homelab/shopify-back-in-stock@sha256:0571359832530a9d44e4a62e4b91514fc721bb923962c28540c1894b596104ca
              imagePullPolicy: IfNotPresent
              command:
                - node
                - -e
                - |
                  const url = 'http://back-in-stock-app/api/admin/preorders/reconcile-holds';
                  const token = process.env.PREORDERS_API_TOKEN;
                  if (!token) { console.error('PREORDERS_API_TOKEN missing'); process.exit(1); }
                  const ctrl = new AbortController();
                  // 9min: por debajo de activeDeadlineSeconds (600s) para abortar
                  // con error legible antes del DeadlineExceeded silencioso del job.
                  const timer = setTimeout(() => ctrl.abort(), 540000);
                  fetch(url, { method: 'POST', headers: { Authorization: 'Bearer ' + token }, signal: ctrl.signal })
                    .then(async (r) => {
                      clearTimeout(timer);
                      const body = await r.text();
                      console.log('reconcile-holds', r.status, body);
                      process.exit(r.ok ? 0 : 1);
                    })
                    .catch((e) => { clearTimeout(timer); console.error('reconcile-holds error', e && e.message); process.exit(1); });
              env:
                - name: PREORDERS_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: back-in-stock-secrets
                      key: PREORDERS_API_TOKEN
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
