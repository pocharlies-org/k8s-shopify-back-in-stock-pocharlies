apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-in-stock-worker-email
  labels:
    app.kubernetes.io/name: back-in-stock-worker-email
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: back-in-stock-worker-email
  template:
    metadata:
      labels:
        app.kubernetes.io/name: back-in-stock-worker-email
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: worker
          image: harbor.lan.e-dani.com/homelab/shopify-back-in-stock-worker-email@sha256:b52b2702c3ecaf6f77ab54bca027fe7e9d1293d17afb3edb74c3e8c88eb9601a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: QUEUE_NAME
              value: notifications.email
            - name: HEALTH_PORT
              value: "8080"
            # Deliver via the Synapse messaging adapter (Gmail API, deliverable)
            # instead of the bundled Maddy relay (DMARC-dropped). SYNAPSE_RABBITMQ_URL
            # is injected from the back-in-stock-secrets Vault secret.
            - name: EMAIL_TRANSPORT
              value: synapse
            # Canonical storefront host for the restock-email one-click
            # unsubscribe link (worker self-derives the token from
            # SHOPIFY_API_SECRET via envFrom back-in-stock-secrets). If absent,
            # the worker falls back to https://<shop>; if the secret is absent
            # the footer is simply omitted (graceful).
            - name: STOREFRONT_BASE_URL
              value: https://www.skirmshop.es
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@shared-rabbitmq.databases.svc.cluster.local:5672/%2Fback-in-stock
          envFrom:
            - secretRef:
                name: back-in-stock-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 384Mi
---
