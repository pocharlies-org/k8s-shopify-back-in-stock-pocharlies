apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-in-stock-worker-whatsapp
  labels:
    app.kubernetes.io/name: back-in-stock-worker-whatsapp
spec:
  # WhatsApp now delivers through the Synapse messaging adapter (the live
  # whatsapp-mcp connectors), exactly like the email worker — the bespoke
  # WHATSAPP_MCP_URL HTTP sender is gone. Delivery is queue-based: the worker
  # publishes messaging.<tenant>.send to the "commands" exchange on the /synapse
  # vhost. SYNAPSE_RABBITMQ_URL is injected from back-in-stock-secrets (same as
  # the email worker); SYNAPSE_TENANT/SYNAPSE_COMMANDS_EXCHANGE default to
  # skirmshop/commands in the worker. Scale to 1 — the channel can now actually
  # deliver. (Single replica is enough for the current volume; scale out
  # horizontally if the notifications.whatsapp queue backs up.)
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: back-in-stock-worker-whatsapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: back-in-stock-worker-whatsapp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: worker
          image: harbor.lan.e-dani.com/homelab/shopify-back-in-stock-worker-whatsapp@sha256:930530eb7c7e542718d1882cb7ad88ac3e4333081ea82fd22551f06bbc057360
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: QUEUE_NAME
              value: notifications.whatsapp
            - name: HEALTH_PORT
              value: "8080"
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@shared-rabbitmq.databases.svc.cluster.local:5672/%2Fback-in-stock
          envFrom:
            - secretRef:
                name: back-in-stock-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 384Mi
