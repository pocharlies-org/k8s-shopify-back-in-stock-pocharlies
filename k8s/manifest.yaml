apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: back-in-stock-strip-prefix
  labels:
    app.kubernetes.io/name: back-in-stock-app
spec:
  stripPrefix:
    prefixes:
      - /apps/back-in-stock
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: back-in-stock-public
  labels:
    app.kubernetes.io/name: back-in-stock-app
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    - kind: Rule
      match: Host(`sauvage.e-dani.com`) && PathPrefix(`/apps/back-in-stock`)
      priority: 1000
      middlewares:
        - name: back-in-stock-strip-prefix
      services:
        - name: back-in-stock-app
          port: 80
    - kind: Rule
      match: Host(`sauvage.e-dani.com`) && Path(`/`)
      priority: 950
      services:
        - name: back-in-stock-app
          port: 80
    - kind: Rule
      match: Host(`sauvage.e-dani.com`) && (PathPrefix(`/auth`) || PathPrefix(`/app`) || PathPrefix(`/api`) || PathPrefix(`/webhooks`) || PathPrefix(`/__manifest`) || Path(`/healthz`) || Path(`/readyz`))
      priority: 900
      services:
        - name: back-in-stock-app
          port: 80
  tls:
    store:
      name: default
      namespace: traefik-edge
