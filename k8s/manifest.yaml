apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-in-stock-worker-email
  labels:
    app.kubernetes.io/name: back-in-stock-worker-email
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: back-in-stock-worker-email
  template:
    metadata:
      labels:
        app.kubernetes.io/name: back-in-stock-worker-email
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: worker
          image: harbor.lan.e-dani.com/homelab/shopify-back-in-stock-worker-email@sha256:d6b2563b7ce89576d5771062b5a450f1d84cba98654a34d70e69da4da5a26e30
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: QUEUE_NAME
              value: notifications.email
            - name: HEALTH_PORT
              value: "8080"
            # Deliver via the Synapse messaging adapter (Gmail API, deliverable)
            # instead of the bundled Maddy relay (DMARC-dropped). SYNAPSE_RABBITMQ_URL
            # is injected from the back-in-stock-secrets Vault secret.
            - name: EMAIL_TRANSPORT
              value: synapse
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@shared-rabbitmq.databases.svc.cluster.local:5672/%2Fback-in-stock
          envFrom:
            - secretRef:
                name: back-in-stock-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 384Mi
---
