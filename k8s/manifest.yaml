apiVersion: v1
kind: ConfigMap
metadata:
  name: back-in-stock-maddy-config
  labels:
    app.kubernetes.io/name: back-in-stock-maddy
data:
  maddy.conf: |
    $(hostname) = {env:MADDY_HOSTNAME}
    $(primary_domain) = {env:MADDY_DOMAIN}

    tls off

    hostname $(hostname)
    state_dir /data
    runtime_dir /tmp

    smtp tcp://0.0.0.0:25 {
        limits {
            all rate 50 1m
            all concurrency 10
        }

        source $(primary_domain) {
            deliver_to &remote_queue
        }

        default_source {
            deliver_to &remote_queue
        }
    }

    target.queue remote_queue {
        target &outbound_delivery
        autogenerated_msg_domain $(primary_domain)
    }

    target.remote outbound_delivery {
        limits {
            destination rate 20 1s
            destination concurrency 10
        }
        mx_auth {
            dane
            mtasts {
                cache fs
                fs_dir mtasts_cache/
            }
            local_policy {
                min_tls_level encrypted
                min_mx_level none
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-in-stock-app
  labels:
    app.kubernetes.io/name: back-in-stock-app
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: back-in-stock-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: back-in-stock-app
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: app
          image: harbor.lan.e-dani.com/homelab/shopify-back-in-stock@sha256:a33e2a102cf79752e6e1752016757ad57c6df666719a40c1c6c435ea6ca13831
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3470
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3470"
            - name: SHOPIFY_APP_URL
              value: https://sauvage.e-dani.com
            - name: CALLBACK_BASE_URL
              value: https://sauvage.e-dani.com
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/back_in_stock
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@shared-rabbitmq.databases.svc.cluster.local:5672/%2Fback-in-stock
          envFrom:
            - secretRef:
                name: back-in-stock-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 75m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: back-in-stock-app
  labels:
    app.kubernetes.io/name: back-in-stock-app
spec:
  selector:
    app.kubernetes.io/name: back-in-stock-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
