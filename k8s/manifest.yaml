apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-in-stock-maddy
  labels:
    app.kubernetes.io/name: back-in-stock-maddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: back-in-stock-maddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: back-in-stock-maddy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: maddy
          image: foxcpp/maddy@sha256:de42151adff6388edb5e4ee88f60334fa1ab85e309485193ecb1c2db20203315
          imagePullPolicy: IfNotPresent
          ports:
            - name: smtp
              containerPort: 25
          env:
            - name: MADDY_HOSTNAME
              value: mail.skirmshop.es
            - name: MADDY_DOMAIN
              value: skirmshop.es
          volumeMounts:
            - name: config
              mountPath: /data/maddy.conf
              subPath: maddy.conf
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: back-in-stock-maddy-config
        - name: data
          emptyDir: {}
---
