apiVersion: v1
kind: ConfigMap
metadata:
  name: back-in-stock-maddy-config
  labels:
    app.kubernetes.io/name: back-in-stock-maddy
data:
  maddy.conf: |
    $(hostname) = {env:MADDY_HOSTNAME}
    $(primary_domain) = {env:MADDY_DOMAIN}

    tls off

    hostname $(hostname)
    state_dir /data
    runtime_dir /tmp

    smtp tcp://0.0.0.0:25 {
        limits {
            all rate 50 1m
            all concurrency 10
        }

        source $(primary_domain) {
            deliver_to &remote_queue
        }

        default_source {
            deliver_to &remote_queue
        }
    }

    target.queue remote_queue {
        target &outbound_delivery
        autogenerated_msg_domain $(primary_domain)
    }

    target.remote outbound_delivery {
        limits {
            destination rate 20 1s
            destination concurrency 10
        }
        mx_auth {
            dane
            mtasts {
                cache fs
                fs_dir mtasts_cache/
            }
            local_policy {
                min_tls_level encrypted
                min_mx_level none
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-in-stock-app
  labels:
    app.kubernetes.io/name: back-in-stock-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: back-in-stock-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: back-in-stock-app
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: app
          image: harbor.lan.e-dani.com/homelab/shopify-back-in-stock@sha256:f10cffa62b687eb82c8d5711f992137394ca6d0749c8daa5d37ba627627c7b80
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3470
          env:
            - name: NODE_ENV
              value: production
            # Bound the V8 old-space heap below the cgroup memory limit so GC
            # reclaims before the kernel OOMKills the pod. 512Mi leaves headroom
            # under the 1Gi limit for non-heap RSS (Prisma engine, buffers).
            - name: NODE_OPTIONS
              value: --max-old-space-size=512
            - name: PORT
              value: "3470"
            - name: SHOPIFY_APP_URL
              value: https://sauvage.e-dani.com
            - name: SCOPES
              value: "read_products,write_products,read_inventory,read_customers,read_orders,write_orders,read_all_orders,read_customer_payment_methods,read_purchase_options,write_purchase_options,read_payment_mandate,write_payment_mandate,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"
            - name: CALLBACK_BASE_URL
              value: https://sauvage.e-dani.com
            # Canonical storefront host for customer-facing links (the
            # double-opt-in confirm email link + the confirm page CTA). Prefer
            # the public skirmshop.es domain over the raw *.myshopify.com host so
            # the link looks trustworthy. Plain public value (not a secret); if
            # absent the app falls back to https://<shop> automatically.
            - name: STOREFRONT_BASE_URL
              value: https://www.skirmshop.es
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: password
            # connection_limit=5 caps the Prisma pool against the SHARED
            # Postgres (default is num_cpus*2+1, which over-allocated and fed the
            # contention/OOM storm). pool_timeout=10 fails fast instead of piling
            # up waiters. Conservative on shared postgres-shared capacity.
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/back_in_stock?connection_limit=5&pool_timeout=10
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@shared-rabbitmq.databases.svc.cluster.local:5672/%2Fback-in-stock
          envFrom:
            - secretRef:
                name: back-in-stock-secrets
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 36
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          # Memory is OOM-bounded by the cgroup limit (1Gi, raised from 768Mi)
          # plus the NODE_OPTIONS heap cap above; requests==limits on memory so
          # the kubelet won't evict under node memory pressure. CPU is left
          # WITHOUT a hard limit (request 250m only): a hard cpu cap throttles
          # the webhook handler under burst, which LENGTHENS lock-hold windows
          # and increases deadlock probability — the opposite of the goal.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: back-in-stock-app
  labels:
    app.kubernetes.io/name: back-in-stock-app
spec:
  selector:
    app.kubernetes.io/name: back-in-stock-app
  ports:
    - name: http
      port: 80
