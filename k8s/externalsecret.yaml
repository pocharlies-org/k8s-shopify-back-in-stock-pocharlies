apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: back-in-stock-secrets
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: back-in-stock-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: skirmshop-back-in-stock
