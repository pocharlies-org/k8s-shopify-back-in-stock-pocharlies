apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: back-in-stock-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: back-in-stock-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: secret/skirmshop/back-in-stock
